    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#B9C9B5" opacity=".5"/></pattern>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#294E38" flood-opacity=".08"/></filter>
  </defs>
  <rect x="1" y="1" width="1278" height="418" rx="24" fill="url(#bg)" stroke="#DCE5D8"/>
